[package]
name = "smart-pc-manager"
version = "0.1.0"
description = "BalDoX Guard — Guerreiro digital do seu computador"
authors = ["Fernando Tanaka"]
edition = "2021"

[lib]
name = "smart_pc_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
once_cell = "1"
parking_lot = "0.12"
dirs = "6"
hex = "0.4"
glob = "0.3"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
